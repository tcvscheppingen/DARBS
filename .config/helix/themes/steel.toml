# Steel: neutral greys with one steel-blue accent, the DARBS palette.
# The same colors are in dwm, st, dmenu, slock, dunst and Neovim
# (~/.config/nvim/colors/steel.lua).

# Syntax: blue keywords, cyan types, mint strings, violet constants.
# Red and gold are kept for errors and warnings.
"comment" = { fg = "comment", modifiers = ["italic"] }
"constant" = "magenta"
"constant.character.escape" = "cyan"
"constant.numeric" = "magenta"
"string" = "green"
"string.regexp" = "cyan"
"variable" = "fg"
"variable.builtin" = "magenta"
"variable.parameter" = "fg"
"variable.other.member" = "fg"
"function" = "fg_bright"
"function.builtin" = "cyan"
"function.macro" = "bright_blue"
"keyword" = "blue"
"keyword.control.return" = { fg = "blue", modifiers = ["bold"] }
"keyword.directive" = "bright_blue"
"operator" = "fg_dim"
"punctuation" = "fg_dim"
"type" = "cyan"
"type.builtin" = "cyan"
"constructor" = "cyan"
"namespace" = "fg"
"attribute" = "bright_blue"
"label" = "blue"
"special" = "cyan"
"tag" = "blue"

"markup.heading" = { fg = "fg_bright", modifiers = ["bold"] }
"markup.list" = "blue"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "bright_blue", modifiers = ["underlined"] }
"markup.link.text" = "blue"
"markup.quote" = { fg = "comment", modifiers = ["italic"] }
"markup.raw" = "green"

"diff.plus" = "green"
"diff.minus" = "red"
"diff.delta" = "blue"

# Editor
"ui.background" = { bg = "bg" }
"ui.text" = "fg"
"ui.text.focus" = { fg = "fg_bright", bg = "bg2" }
"ui.text.inactive" = "comment"
"ui.linenr" = "grey"
"ui.linenr.selected" = { fg = "bright_blue", modifiers = ["bold"] }
"ui.cursor" = { fg = "bg", bg = "fg_dim" }
"ui.cursor.primary" = { fg = "bg", bg = "fg" }
"ui.cursor.match" = { bg = "bg3", modifiers = ["bold"] }
"ui.cursorline.primary" = { bg = "bg1" }
"ui.selection" = { bg = "selection" }
"ui.selection.primary" = { bg = "selection" }
"ui.highlight" = { bg = "bg2" }
"ui.virtual.whitespace" = "bg3"
"ui.virtual.indent-guide" = "bg2"
"ui.virtual.ruler" = { bg = "bg1" }
"ui.virtual.inlay-hint" = "comment"
"ui.virtual.jump-label" = { fg = "fg_bright", bg = "accent", modifiers = ["bold"] }
"ui.window" = "bg3"
"ui.gutter" = { bg = "bg" }

"ui.statusline" = { fg = "fg", bg = "bg2" }
"ui.statusline.inactive" = { fg = "fg_dim", bg = "bg1" }
"ui.statusline.normal" = { fg = "fg_bright", bg = "accent", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "bg", bg = "green", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "bg", bg = "magenta", modifiers = ["bold"] }
"ui.bufferline" = { fg = "fg_dim", bg = "bg1" }
"ui.bufferline.active" = { fg = "fg_bright", bg = "accent", modifiers = ["bold"] }

"ui.popup" = { fg = "fg", bg = "bg1" }
"ui.popup.info" = { fg = "fg", bg = "bg1" }
"ui.help" = { fg = "fg", bg = "bg1" }
"ui.menu" = { fg = "fg", bg = "bg1" }
"ui.menu.selected" = { fg = "fg_bright", bg = "accent", modifiers = ["bold"] }
"ui.menu.scroll" = { fg = "grey", bg = "bg2" }

"error" = "red"
"warning" = "yellow"
"info" = "blue"
"hint" = "cyan"
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.hint" = { underline = { color = "cyan", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

[palette]
bg_dark = "#111111"
bg = "#151515"
bg1 = "#1f1f1f"
bg2 = "#2a2a2a"
bg3 = "#3a3a3a"
selection = "#263547"
grey = "#5a5a5a"
comment = "#6c6c6c"
fg_dim = "#8a8a8a"
fg = "#c6c6c6"
fg_bright = "#e8e8e8"

accent = "#3d7ab8"
red = "#c25d5d"
green = "#6fa392"
yellow = "#c4a35e"
blue = "#5b8fc7"
bright_blue = "#74a5da"
magenta = "#8f7fc2"
cyan = "#5ea7b5"
